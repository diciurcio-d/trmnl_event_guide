<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whaddup NYC (beta)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" rel="stylesheet">
    <style>
        :root {
            --bg-1: #f7f5ee;
            --bg-2: #dde8df;
            --panel: #fbfaf7;
            --ink: #1f2a23;
            --muted: #5d6a60;
            --line: #c9d3cb;
            --brand: #176f4f;
            --brand-2: #0d4d35;
            --accent: #c66a2e;
            --bubble-user: #176f4f;
            --bubble-assistant: #edf2ee;
            --radius-lg: 16px;
            --radius-md: 10px;
            --panel-height: clamp(560px, 74vh, 820px);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(1200px 600px at 10% -5%, #fff4d9 0%, transparent 55%),
                radial-gradient(900px 500px at 100% 0%, #d9f1e5 0%, transparent 58%),
                linear-gradient(160deg, var(--bg-1), var(--bg-2));
        }

        .app {
            max-width: 1180px;
            margin: 0 auto;
            padding: 22px 18px 28px;
            animation: fadeIn 350ms ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title {
            margin: 0;
            font-family: "Fraunces", serif;
            font-size: clamp(30px, 5vw, 46px);
            line-height: 1.05;
            letter-spacing: -0.02em;
        }

        .title-accent {
            display: block;
            width: 44px;
            height: 3px;
            background: var(--brand);
            border-radius: 2px;
            margin: 10px 0 12px;
        }

        .subhead {
            margin: 0 0 16px;
            color: var(--muted);
        }

        .status-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .pill {
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 6px 12px;
            background: #ffffffaa;
            font-size: 13px;
        }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            column-gap: 16px;
            row-gap: 0;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 28px rgba(12, 37, 25, 0.08);
        }

        .filters {
            padding: 14px;
        }

        .filters-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 0 0 10px;
        }

        .filters h2,
        .chat h2 {
            margin: 0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
        }

        .filters-toggle {
            display: none; /* mobile only */
        }

        .filters-body {
        }

        .field {
            margin-bottom: 14px;
        }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .field input[type="number"],
        .field input[type="text"],
        .field select,
        .composer textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            padding: 10px 11px;
            font-size: 14px;
            background: #fff;
            color: var(--ink);
            min-height: 42px;
        }

        .composer textarea {
            resize: none;
            overflow-y: hidden;
            line-height: 1.45;
            max-height: calc(1.45em * 3 + 20px); /* 3 lines + vertical padding */
        }

        .composer textarea.scrollable {
            overflow-y: auto;
        }

        .helper {
            color: var(--muted);
            font-size: 12px;
            margin-top: 4px;
        }

        .helper.error {
            color: #b42318;
            display: none;
            margin-top: 6px;
        }

        .helper.error.visible {
            display: block;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--ink);
            margin-top: 8px;
        }

        .sessions-section {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--line);
        }

        .sessions-header {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 8px;
        }

        .session-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .session-item {
            padding: 7px 8px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: background 0.12s;
        }

        .session-item:hover { background: var(--bg-2); }

        .session-item--active {
            background: rgba(23, 111, 79, 0.09);
        }

        .session-title {
            font-size: 13px;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .session-date {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
        }

        .sessions-empty {
            font-size: 12px;
            color: var(--muted);
            font-style: italic;
            padding: 4px 8px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            padding: 9px 11px;
            background: #fff;
            color: var(--ink);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .btn.primary {
            border-color: var(--brand);
            background: var(--brand);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 42px;
        }

        .btn.primary:hover {
            background: var(--brand-2);
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            background: none;
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
        }
        .new-chat-btn:hover { border-color: var(--brand); color: var(--brand); }

        .chat {
            display: grid;
            grid-template-rows: auto 1fr auto;
            height: var(--panel-height);
            overflow: hidden;
        }

        .chat-head {
            padding: 14px 16px 10px;
            border-bottom: 1px solid var(--line);
        }

        .chat-log {
            padding: 16px;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 86%;
            border-radius: 13px;
            padding: 11px 12px;
            animation: fadeIn 250ms ease;
            line-height: 1.42;
            font-size: 14px;
        }

        .message.user {
            align-self: flex-end;
            background: var(--bubble-user);
            color: #fff;
        }

        .message.assistant {
            align-self: flex-start;
            background: var(--bubble-assistant);
            border: 1px solid #d8e4da;
            color: var(--ink);
        }

        @keyframes searching-dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
        }
        .searching-dots::after {
            content: '';
            animation: searching-dots 1.6s steps(1, end) infinite;
        }

        .result-list {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .result {
            border: 1px solid #d8e4da;
            border-radius: 10px;
            background: #fff;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .result-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-date {
            font-size: 11px;
            font-weight: 600;
            color: var(--brand);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .result-travel {
            font-size: 11px;
            color: var(--muted);
            background: #edf3ee;
            border-radius: 999px;
            padding: 2px 7px;
            white-space: nowrap;
        }

        .result-name {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.35;
        }

        .result-name a {
            color: var(--ink);
            text-decoration: none;
        }

        .result-name a:hover {
            color: var(--brand-2);
            text-decoration: underline;
            text-underline-offset: 2px;
            text-decoration-thickness: 1px;
        }

        .result-venue-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .result-venue {
            font-size: 12px;
            color: var(--muted);
        }

        .result-cat {
            font-size: 11px;
            color: var(--muted);
            background: #f0f4f1;
            border-radius: 999px;
            padding: 1px 7px;
        }

        .result-price {
            font-size: 11px;
            color: var(--muted);
            background: #f0f4f1;
            border-radius: 999px;
            padding: 1px 7px;
        }
        .result-price[data-free="true"] {
            color: #2a7a3b;
            background: #e6f4ea;
        }

        .result-recurring {
            font-size: 11px;
            color: #7a5a1e;
            background: #fef3cd;
            border-radius: 999px;
            padding: 1px 7px;
        }

        .result-ask-btn {
            align-self: flex-end;
            margin-top: 2px;
            font-size: 0.68rem;
            color: var(--muted);
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.15s, color 0.15s;
        }
        .result-ask-btn:hover { opacity: 1; color: var(--brand); }

        .result-card--selected {
            outline: 2px solid var(--brand);
            outline-offset: 3px;
        }

        .result-desc {
            margin-top: 3px;
            font-size: 12px;
            color: #3f4d45;
            line-height: 1.38;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .dedupe-note {
            margin-top: 8px;
            font-size: 12px;
            color: var(--muted);
        }

        .more-box {
            margin-top: 10px;
            border: 1px solid #d8e4da;
            border-radius: 10px;
            background: #f8fbf8;
            padding: 8px;
        }

        .more-box-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .more-box-list {
            margin-top: 0;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .composer {
            border-top: 1px solid var(--line);
            padding: 12px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            background: #f6f9f6;
        }

        .chat-attribution {
            grid-column: 2;
            text-align: right;
            font-size: 11px;
            color: var(--muted);
            padding: 6px 0 0;
            margin: 0;
        }

        .chat-attribution a {
            color: var(--muted);
        }

        .hint-row {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .hint {
            border: 1px solid #d6e1d8;
            background: #ffffffcc;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
            color: #334139;
            transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
        }

        .hint:hover {
            border-color: var(--brand);
            background: rgba(23, 111, 79, 0.07);
            color: var(--brand-2);
        }

        .empty-note {
            color: var(--muted);
            font-size: 13px;
        }

        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
                row-gap: 12px;
            }

            .chat-attribution {
                grid-column: 1;
            }

            .filters {
                padding: 10px;
            }

            .filters-body {
                max-height: 60vh;
                overflow-y: auto;
            }

            .field {
                margin-bottom: 8px;
            }

            .field-row {
                grid-template-columns: 1fr 1fr;
                margin-bottom: 8px;
            }

            .field label {
                margin-bottom: 3px;
            }

            .chat {
                height: 75vh;
                min-height: 480px;
            }

            .filters-toggle {
                display: flex;
                align-items: center;
                gap: 4px;
                background: none;
                border: 1px solid var(--line);
                border-radius: var(--radius-md);
                padding: 4px 10px;
                font-size: 12px;
                font-weight: 600;
                color: var(--muted);
                cursor: pointer;
            }

            .filters-toggle .filters-chevron {
                transition: transform 0.2s ease;
            }

            .filters.collapsed .filters-body {
                display: none;
            }

            .filters.collapsed .filters-chevron {
                transform: rotate(-90deg);
            }
        }

        /* ── Subway bullet circles ──────────────────────────────────────────── */
        .subway-bullet {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 11px;
            font-weight: 700;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            flex-shrink: 0;
            line-height: 1;
            letter-spacing: 0;
        }

        /* ── Subway section collapse animation ──────────────────────────────── */
        #subway-filter-section {
            overflow: hidden;
            max-height: 130px;
            opacity: 1;
            transition: max-height 0.28s ease, opacity 0.2s ease;
            margin-top: 0;
        }
        #subway-filter-section.hidden {
            max-height: 0;
            opacity: 0;
            pointer-events: none;
        }
        #subway-filter-section .field-row {
            margin-bottom: 14px;
        }

        /* ── Tom Select theme ───────────────────────────────────────────────── */
        .ts-wrapper {
            font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        }
        .ts-control {
            min-height: 42px !important;
            border: 1px solid var(--line) !important;
            border-radius: var(--radius-md) !important;
            background: #fff !important;
            padding: 6px 2.5rem 6px 11px !important;
            box-shadow: none !important;
            font-size: 14px !important;
            color: var(--ink) !important;
            align-items: center !important;
            gap: 6px !important;
            cursor: pointer !important;
        }
        .ts-wrapper.focus .ts-control {
            border-color: var(--brand) !important;
            box-shadow: 0 0 0 2px rgba(23,111,79,0.18) !important;
            outline: none !important;
        }
        .ts-dropdown {
            border: 1px solid var(--line) !important;
            border-radius: var(--radius-md) !important;
            box-shadow: 0 4px 16px rgba(12,37,25,0.12) !important;
            font-size: 14px !important;
            font-family: "IBM Plex Sans", "Segoe UI", sans-serif !important;
            color: var(--ink) !important;
        }
        .ts-dropdown .option {
            padding: 8px 12px !important;
            color: var(--ink) !important;
        }
        .ts-dropdown .option.active {
            background: #edf5ef !important;
            color: var(--ink) !important;
        }
        .ts-dropdown [data-selectable]:hover {
            background: #f0f5f1 !important;
            color: var(--ink) !important;
        }
        .ts-dropdown .option.selected {
            font-weight: 600 !important;
        }
        .ts-dropdown-content {
            max-height: 220px !important;
        }
        /* Option/item layouts for subway lines */
        .ts-opt-line, .ts-itm-line {
            display: flex;
            align-items: center;
            gap: 8px;
            line-height: 1.3;
        }
        .ts-opt-placeholder, .ts-itm-placeholder {
            color: var(--muted);
        }
        /* Dropdowns portaled to <body> must float above all panels */
        body > .ts-dropdown {
            z-index: 9999;
        }
    </style>
</head>
<body>
    <main class="app">
        <h1 class="title">Whaddup NYC <span style="font-size:0.45em; font-weight:500; vertical-align:middle; opacity:0.6; letter-spacing:0.03em; font-family:'IBM Plex Sans',sans-serif;">beta</span></h1>
        <span class="title-accent" aria-hidden="true"></span>
        <p class="subhead">Discover what's on in NYC — concerts, comedy, art, talks, and more.</p>

        <section class="layout">
            <aside class="panel filters" id="filters-panel">
                <div class="filters-header">
                    <h2>Filters</h2>
                    <button class="filters-toggle" id="filters-toggle" type="button" aria-expanded="true" aria-controls="filters-body">
                        <span class="filters-toggle-label">Hide</span>
                        <svg class="filters-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                            <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>

                <div class="filters-body" id="filters-body">
                    <div class="field-row">
                        <div class="field">
                            <label for="distance-mode">Travel mode</label>
                            <select id="distance-mode">
                                <option value="none">No filter</option>
                                <option value="walking">Walking</option>
                                <option value="transit" selected>Transit</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="max-travel">Max travel (min)</label>
                            <select id="max-travel">
                                <option value="15">15</option>
                                <option value="30">30</option>
                                <option value="45">45</option>
                                <option value="60" selected>60</option>
                                <option value="75">75</option>
                                <option value="90">90</option>
                            </select>
                        </div>
                    </div>

                    <div id="subway-filter-section">
                        <div class="field-row">
                            <div class="field">
                                <label for="subway-line">Subway line</label>
                                <select id="subway-line"></select>
                            </div>
                            <div class="field">
                                <label for="subway-station">Station</label>
                                <select id="subway-station"></select>
                            </div>
                        </div>
                    </div>

                    <div class="sessions-section">
                        <div class="sessions-header">Past Conversations</div>
                        <div class="session-list" id="session-list">
                            <div class="sessions-empty">No past conversations yet.</div>
                        </div>
                    </div>
                </div>
            </aside>

            <section class="panel chat">
                <div class="chat-head">
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
                        <h2 style="margin:0">Event Search</h2>
                        <button id="new-chat-btn" class="new-chat-btn" type="button">New chat</button>
                    </div>
                    <div class="empty-note">What are you in the mood for? Try something like...</div>
                    <div class="hint-row">
                        <button class="hint" type="button">🎤 Interesting lecture next week</button>
                        <button class="hint" type="button">🎵 Live music in Brooklyn this weekend</button>
                        <button class="hint" type="button">🎭 Comedy shows this weekend</button>
                    </div>
                </div>

                <div id="chat-log" class="chat-log"></div>

                <form id="chat-form" class="composer">
                    <textarea id="chat-input" placeholder="Ask for events..." autocomplete="off" rows="1"></textarea>
                    <button class="btn primary" id="send-btn" type="submit" aria-label="Send">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                            <path d="M2 8h12M9 3l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </form>
            </section>
            <p class="chat-attribution">Created by David DiCiurcio. <a href="mailto:diciurcio.david@gmail.com">Reach out</a> with any feedback.</p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
    <script>
        const chatLogEl = document.getElementById("chat-log");
        const chatFormEl = document.getElementById("chat-form");
        const chatInputEl = document.getElementById("chat-input");
        const sendBtnEl = document.getElementById("send-btn");
        const distanceModeEl = document.getElementById("distance-mode");
        const subwayFilterSectionEl = document.getElementById("subway-filter-section");

        // Follow-up state: when the assistant asks a clarifying question,
        // we hold the original query here and send it with the user's answer as context.
        let _pendingQuery = null;
        let _pendingFollowUpQuestion = null;

        // Event follow-up state: set when user clicks "Tell me more" on a result card.
        let _selectedEvent = null; // { url, name, cloudflare_protected }

        // Conversation history: track recent user queries and assistant summaries
        // so each new query has context about what was previously searched.
        const HISTORY_VERSION = 1;
        const HISTORY_KEY = "whaddup_history";

        function loadHistory() {
            try {
                const stored = JSON.parse(localStorage.getItem(HISTORY_KEY) || "{}");
                if (stored.v === HISTORY_VERSION && Array.isArray(stored.history)) {
                    return stored.history;
                }
                // v0 or unknown: no migration needed yet, start fresh
            } catch (_) {}
            return [];
        }

        function saveHistory(history) {
            try {
                localStorage.setItem(HISTORY_KEY, JSON.stringify({ v: HISTORY_VERSION, history }));
            } catch (_) {}
        }

        let _chatHistory = loadHistory(); // { role: "user"|"assistant", text: string }

        let originStationId = "";
        let stationsByLine = {};
        let tsLine = null;
        let tsStation = null;

        const LINE_COLORS = {
            '1': { bg: '#EE352E', text: '#fff' }, '2': { bg: '#EE352E', text: '#fff' },
            '3': { bg: '#EE352E', text: '#fff' }, '4': { bg: '#00933C', text: '#fff' },
            '5': { bg: '#00933C', text: '#fff' }, '6': { bg: '#00933C', text: '#fff' },
            '7': { bg: '#B933AD', text: '#fff' }, 'A': { bg: '#0039A6', text: '#fff' },
            'B': { bg: '#FF6319', text: '#fff' }, 'C': { bg: '#0039A6', text: '#fff' },
            'D': { bg: '#FF6319', text: '#fff' }, 'E': { bg: '#0039A6', text: '#fff' },
            'F': { bg: '#FF6319', text: '#fff' }, 'G': { bg: '#6CBE45', text: '#fff' },
            'H': { bg: '#808183', text: '#fff' }, 'J': { bg: '#996633', text: '#fff' },
            'L': { bg: '#A7A9AC', text: '#fff' }, 'M': { bg: '#FF6319', text: '#fff' },
            'N': { bg: '#FCCC0A', text: '#000' }, 'Q': { bg: '#FCCC0A', text: '#000' },
            'R': { bg: '#FCCC0A', text: '#000' }, 'S': { bg: '#808183', text: '#fff' },
        };

        function bulletHtml(line) {
            const c = LINE_COLORS[line] || { bg: '#808183', text: '#fff' };
            return `<span class="subway-bullet" style="background:${c.bg};color:${c.text}">${escapeHtml(line)}</span>`;
        }

        function setSubwaySectionVisible(visible) {
            subwayFilterSectionEl.classList.toggle("hidden", !visible);
        }

        function normalizeForDedup(value) {
            return String(value || "")
                .toLowerCase()
                .replace(/&amp;/g, "and")
                .replace(/&#038;/g, "and")
                .replace(/[^a-z0-9\s]/g, " ")
                .replace(/\s+/g, " ")
                .trim();
        }

        function eventDayToken(event) {
            const dateStr = String(event.date_str || "").trim();
            if (dateStr) return dateStr;
            const dt = String(event.datetime || "").trim();
            if (dt.includes("T")) return dt.split("T")[0];
            return dt || "unknown-date";
        }

        function dedupeKey(event) {
            const name = normalizeForDedup(event.name || "untitled event");
            const day = eventDayToken(event);
            const eventType = normalizeForDedup(event.event_type || "");
            return `${name}|${day}|${eventType}`;
        }

        function eventQualityScore(event) {
            let score = 0;
            if (event.url) score += 4;
            if (event.description) score += Math.min(3, String(event.description).length / 80);
            if (event.venue_name) score += 1;
            if (event.travel_minutes !== null && event.travel_minutes !== undefined && event.travel_minutes !== "") {
                score += 2;
            }
            return score;
        }

        function dedupeMatches(matches) {
            const bestByKey = new Map();
            let duplicateCount = 0;

            matches.forEach((event) => {
                const key = dedupeKey(event);
                const existing = bestByKey.get(key);
                if (!existing) {
                    bestByKey.set(key, event);
                    return;
                }
                duplicateCount += 1;
                if (eventQualityScore(event) > eventQualityScore(existing)) {
                    bestByKey.set(key, event);
                }
            });

            return {
                events: Array.from(bestByKey.values()),
                duplicateCount,
            };
        }

        function normalizedDateForSort(value) {
            const raw = String(value || "").trim();
            if (!raw) return "9999-99-99";
            if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
            const m = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (m) {
                const month = m[1].padStart(2, "0");
                const day = m[2].padStart(2, "0");
                return `${m[3]}-${month}-${day}`;
            }
            return raw;
        }

        function groupSeriesMatches(matches) {
            const grouped = new Map();
            let groupedCount = 0;

            matches.forEach((event, index) => {
                const key = `${normalizeForDedup(event.name || "untitled event")}|${normalizeForDedup(event.venue_name || "venue unknown")}`;
                const dateDisplay = String(event.date_str || eventDayToken(event) || "date TBD").trim();
                const dateSort = normalizedDateForSort(dateDisplay);
                const dateKey = `${dateSort}|${dateDisplay}`;

                if (!grouped.has(key)) {
                    const dateMap = new Map();
                    dateMap.set(dateKey, { sort: dateSort, display: dateDisplay });
                    grouped.set(key, {
                        representative: event,
                        order: index,
                        dateMap,
                    });
                    return;
                }

                groupedCount += 1;
                const current = grouped.get(key);
                current.dateMap.set(dateKey, { sort: dateSort, display: dateDisplay });
                if (eventQualityScore(event) > eventQualityScore(current.representative)) {
                    current.representative = event;
                }
            });

            const merged = Array.from(grouped.values())
                .sort((a, b) => a.order - b.order)
                .map((row) => {
                    const dates = Array.from(row.dateMap.values())
                        .sort((a, b) => String(a.sort).localeCompare(String(b.sort)))
                        .map((d) => d.display);
                    const mergedEvent = { ...row.representative };
                    mergedEvent._group_dates = dates;
                    mergedEvent._group_count = dates.length;
                    return mergedEvent;
                });

            return {
                events: merged,
                groupedCount,
            };
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function normalizeEventUrl(rawUrl) {
            const raw = String(rawUrl || "").trim();
            if (!raw) return "";

            try {
                const parsed = new URL(raw);
                if (parsed.protocol === "http:" || parsed.protocol === "https:") {
                    return parsed.toString();
                }
                return "";
            } catch (_) {
                if (raw.startsWith("www.")) {
                    return `https://${raw}`;
                }
                return "";
            }
        }

        function buildGoogleSearchUrl(event) {
            const terms = [
                event.name || "",
                event.venue_name || "",
                event.date_str || "",
            ].map((v) => String(v).trim()).filter(Boolean).join(" ");
            return `https://www.google.com/search?q=${encodeURIComponent(terms || "event nyc")}`;
        }

        function formatDateDisplay(rawDateStr) {
            if (!rawDateStr) return "";
            const raw = String(rawDateStr).trim();
            // YYYY-MM-DD (ISO)
            const iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (iso) {
                const d = new Date(parseInt(iso[1]), parseInt(iso[2]) - 1, parseInt(iso[3]));
                if (!isNaN(d.getTime())) {
                    return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
                }
            }
            // M/D/YYYY or MM/DD/YYYY
            const mdy = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (mdy) {
                const d = new Date(parseInt(mdy[3]), parseInt(mdy[1]) - 1, parseInt(mdy[2]));
                if (!isNaN(d.getTime())) {
                    return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
                }
            }
            return raw;
        }

        function formatTimeDisplay(datetimeStr) {
            if (!datetimeStr) return "";
            const raw = String(datetimeStr).trim();
            const m = raw.match(/T(\d{2}):(\d{2})/);
            if (m) {
                const hour = parseInt(m[1]);
                const min = parseInt(m[2]);
                if (hour === 0 && min === 0) return "";
                const ampm = hour >= 12 ? "PM" : "AM";
                const h12 = hour % 12 || 12;
                const minStr = min > 0 ? `:${String(min).padStart(2, "0")}` : "";
                return `${h12}${minStr} ${ampm}`;
            }
            return "";
        }

        function slimEventForStorage(e) {
            return {
                name: e.name || "",
                url: e.url || "",
                event_source_url: e.event_source_url || "",
                date_str: e.date_str || "",
                datetime: e.datetime || "",
                venue_name: e.venue_name || "",
                event_type: e.event_type || "",
                description: String(e.description || "").slice(0, 300),
                travel_minutes: e.travel_minutes ?? null,
                is_free: e.is_free ?? null,
                price: e.price || "",
                cloudflare_protected: !!e.cloudflare_protected,
                _group_dates: e._group_dates || null,
                _group_count: e._group_count || null,
            };
        }

        function shortDescription(rawText, maxChars = 180) {
            const text = String(rawText || "").replace(/\s+/g, " ").trim();
            if (!text) return "";
            if (text.length <= maxChars) return text;
            const clipped = text.slice(0, maxChars).trimEnd();
            return `${clipped}...`;
        }

        function formatCategoryLabel(value) {
            const text = String(value || "").trim();
            if (!text) return "";
            return text.replace(/\b([a-z])/g, (m, c) => c.toUpperCase());
        }

        function dateLabelForEvent(event) {
            const dates = Array.isArray(event._group_dates) ? event._group_dates.filter(Boolean) : [];
            if (!dates.length) return event.date_str || "date TBD";
            if (dates.length === 1) return dates[0];

            const preview = dates.slice(0, 4).join(", ");
            if (dates.length > 4) {
                return `Dates: ${preview} +${dates.length - 4} more`;
            }
            return `Dates: ${preview}`;
        }

        function buildResultNode(event, options = {}) {
            const includeDescription = Boolean(options.includeDescription);
            const item = document.createElement("div");
            item.className = "result";

            const name = escapeHtml(event.name || "Untitled event");
            const directUrl = normalizeEventUrl(event.url || "");
            const targetUrl = directUrl || buildGoogleSearchUrl(event);
            const searchHint = directUrl ? "" : ' <small style="opacity:0.55;font-weight:400">(search)</small>';
            const linkedName =
                `<a href="${escapeHtml(targetUrl)}" target="_blank" rel="noopener noreferrer">${name}</a>${searchHint}`;

            // Date + time
            const rawDateLabel = dateLabelForEvent(event);
            const prettyDate = formatDateDisplay(rawDateLabel) || rawDateLabel || "Date TBD";
            const prettyTime = formatTimeDisplay(event.datetime || "");
            const dateDisplay = prettyTime ? `${prettyDate} · ${prettyTime}` : prettyDate;

            // Travel
            const travelRaw = event.travel_minutes;
            const hasTravel = travelRaw !== null && travelRaw !== undefined && travelRaw !== "";
            const travelHtml = hasTravel
                ? `<span class="result-travel">${escapeHtml(String(travelRaw))} min</span>`
                : "";

            // Venue + category + price
            const venueName = escapeHtml(event.venue_name || "");
            const categoryLabel = formatCategoryLabel(event.event_type || "");
            const venueHtml = venueName ? `<span class="result-venue">${venueName}</span>` : "";
            const catHtml = categoryLabel ? `<span class="result-cat">${escapeHtml(categoryLabel)}</span>` : "";
            const isFree = event.is_free;
            const priceRaw = String(event.price || "").trim();
            const priceLabel = isFree === true ? "Free" : (priceRaw || "");
            const priceHtml = priceLabel ? `<span class="result-price" data-free="${isFree === true}">${escapeHtml(priceLabel)}</span>` : "";

            const preview = includeDescription ? shortDescription(event.description || "") : "";
            const descHtml = preview ? `<div class="result-desc">${escapeHtml(preview)}</div>` : "";

            const recurringHtml = event.is_recurring ? `<span class="result-recurring">recurring</span>` : "";

            const venueRowParts = [venueHtml, catHtml, priceHtml, recurringHtml].filter(Boolean);
            const venueRowSep = '<span style="color:var(--line)">·</span>';

            item.innerHTML = `
                <div class="result-top">
                    <span class="result-date">${escapeHtml(dateDisplay)}</span>
                    ${travelHtml}
                </div>
                <div class="result-name">${linkedName}</div>
                ${venueRowParts.length ? `<div class="result-venue-row">${venueRowParts.join(venueRowSep)}</div>` : ""}
                ${descHtml}
            `;

            const askBtn = document.createElement("button");
            askBtn.className = "result-ask-btn";
            askBtn.textContent = "Tell me more";
            askBtn.addEventListener("click", () => {
                _selectedEvent = {
                    url: event.url || event.event_source_url || "",
                    name: event.name || "",
                    cloudflare_protected: !!event.cloudflare_protected,
                };
                const label = _selectedEvent.name.length > 40
                    ? _selectedEvent.name.slice(0, 40) + "…"
                    : _selectedEvent.name;

                // Highlight selected card
                document.querySelectorAll(".result-card--selected")
                    .forEach(c => c.classList.remove("result-card--selected"));
                item.classList.add("result-card--selected");

                // Hint placeholder for follow-up questions
                chatInputEl.placeholder = `Follow up about "${label}"…`;

                // Add user bubble and loading bubble
                const displayName = _selectedEvent.name.length > 50
                    ? _selectedEvent.name.slice(0, 50) + "…"
                    : _selectedEvent.name;
                addMessage(`Tell me about ${displayName}`, "user");
                const thinkingId = addMessage("Looking that up…", "assistant");

                // Fire immediately — no user typing needed
                fetch("/api/event-info", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        event_url: _selectedEvent.url,
                        event_name: _selectedEvent.name,
                        question: "What are the key details for this event? Please include: date and time, venue and location, ticket price or whether it's free, age restrictions, and anything else worth knowing before attending.",
                        cloudflare_protected: _selectedEvent.cloudflare_protected,
                    }),
                })
                .then(r => r.json())
                .then(data => {
                    const text = data.answer || "I couldn't find more info about this event.";
                    replaceMessage(thinkingId, text);
                    const sources = data.source === "web_grounding" ? (data.sources || []) : [];
                    appendEventInfoFooter(thinkingId, sources);
                })
                .catch(() => replaceMessage(thinkingId, "Something went wrong. Try again."));
            });
            item.appendChild(askBtn);

            return item;
        }

        function addMessage(text, role = "assistant", matches = []) {
            const id = "msg-" + Date.now() + "-" + Math.random().toString(36).slice(2);
            const wrap = document.createElement("div");
            wrap.className = `message ${role}`;
            wrap.id = id;
            wrap.innerHTML = text;

            if (matches && matches.length) {
                const { events: dedupedMatches, duplicateCount } = dedupeMatches(matches);
                const { events: groupedMatches, groupedCount } = groupSeriesMatches(dedupedMatches);
                const list = document.createElement("div");
                list.className = "result-list";

                const shouldSplitResults = groupedMatches.length > 10;
                const primaryMatches = shouldSplitResults ? groupedMatches.slice(0, 5) : groupedMatches;
                const moreMatches = shouldSplitResults ? groupedMatches.slice(5) : [];

                primaryMatches.forEach((event) => {
                    list.appendChild(buildResultNode(event, { includeDescription: true }));
                });

                if (duplicateCount > 0 || groupedCount > 0) {
                    const note = document.createElement("div");
                    note.className = "dedupe-note";
                    const parts = [];
                    if (duplicateCount > 0) {
                        parts.push(`${duplicateCount} duplicate listing${duplicateCount === 1 ? "" : "s"} collapsed`);
                    }
                    if (groupedCount > 0) {
                        parts.push(`${groupedCount} same-name venue date entr${groupedCount === 1 ? "y" : "ies"} grouped`);
                    }
                    note.textContent = parts.join(" • ");
                    wrap.appendChild(note);
                }
                wrap.appendChild(list);

                if (moreMatches.length) {
                    const moreBox = document.createElement("div");
                    moreBox.className = "more-box";

                    const title = document.createElement("div");
                    title.className = "more-box-title";
                    title.textContent = `Here's more (${moreMatches.length})`;
                    moreBox.appendChild(title);

                    const moreList = document.createElement("div");
                    moreList.className = "result-list more-box-list";
                    moreMatches.forEach((event) => {
                        moreList.appendChild(buildResultNode(event));
                    });
                    moreBox.appendChild(moreList);
                    wrap.appendChild(moreBox);
                }
            }

            chatLogEl.appendChild(wrap);
            chatLogEl.scrollTop = chatLogEl.scrollHeight;
            return id;
        }

        function renderMarkdown(text) {
            // Split into paragraphs (double newline)
            const paragraphs = String(text).split(/\n{2,}/);
            return paragraphs.map(para => {
                const lines = para.split("\n");
                // Check if this paragraph is a bullet list
                const isList = lines.every(l => /^\s*[-*•]\s+/.test(l) || l.trim() === "");
                if (isList) {
                    const items = lines
                        .filter(l => l.trim())
                        .map(l => {
                            const content = l.replace(/^\s*[-*•]\s+/, "");
                            return `<li>${renderInline(content)}</li>`;
                        });
                    return `<ul style="margin:4px 0 4px 16px;padding:0">${items.join("")}</ul>`;
                }
                // Regular paragraph — join lines with <br>
                return `<p style="margin:0 0 6px">${lines.map(renderInline).join("<br>")}</p>`;
            }).join("");
        }

        function renderInline(text) {
            return text
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
                .replace(/\*(.+?)\*/g, "<em>$1</em>");
        }

        function replaceMessage(id, text) {
            const el = document.getElementById(id);
            if (el) el.innerHTML = renderMarkdown(text);
        }

        function appendEventInfoFooter(id, sources) {
            const el = document.getElementById(id);
            if (!el) return;
            const footer = document.createElement("div");
            footer.style.cssText = "margin-top:8px;padding-top:6px;border-top:1px solid rgba(0,0,0,0.1);font-size:11px;color:var(--muted);line-height:1.5";

            let html = "<em>Info may be incomplete or inaccurate — verify before attending.</em>";

            if (sources && sources.length) {
                const links = sources.slice(0, 2).map((url, i) => {
                    const safe = escapeHtml(url);
                    return `<a href="${safe}" target="_blank" rel="noopener noreferrer" style="color:var(--brand)">Source ${i + 1}</a>`;
                });
                html += " &nbsp;·&nbsp; " + links.join(" &nbsp;·&nbsp; ");
            }

            footer.innerHTML = html;
            el.appendChild(footer);
        }

        function getSelectedCategories() {
            return Array.from(document.querySelectorAll(".category-item input:checked"))
                .map((cb) => cb.value);
        }

        // --- Preference persistence (localStorage) ---
        const PREFS_KEY = "whaddupnyc_prefs";

        function loadPrefs() {
            try { return JSON.parse(localStorage.getItem(PREFS_KEY) || "{}"); }
            catch (_) { return {}; }
        }

        function savePrefs(patch) {
            try {
                const prefs = loadPrefs();
                localStorage.setItem(PREFS_KEY, JSON.stringify({ ...prefs, ...patch }));
            } catch (_) {}
        }

        async function loadSubwayStations() {
            try {
                const resp = await fetch("/api/subway-stations");
                if (!resp.ok) return;
                const data = await resp.json();
                stationsByLine = data.lines || {};

                // Build line options including empty placeholder
                const lineOpts = [{ value: "", text: "Any line…" }];
                for (const line of Object.keys(stationsByLine)) {
                    lineOpts.push({ value: line, text: line });
                }

                tsLine = new TomSelect("#subway-line", {
                    dropdownParent: 'body',
                    options: lineOpts,
                    items: [""],
                    create: false,
                    allowEmptyOption: true,
                    render: {
                        option: (d) => {
                            if (!d.value) return `<div class="ts-opt-placeholder">Any line…</div>`;
                            return `<div class="ts-opt-line">${bulletHtml(d.value)}<span>${escapeHtml(d.value)} train</span></div>`;
                        },
                        item: (d) => {
                            if (!d.value) return `<div class="ts-itm-placeholder">Any line…</div>`;
                            return `<div class="ts-itm-line">${bulletHtml(d.value)}<span>${escapeHtml(d.value)} train</span></div>`;
                        },
                    },
                    onChange: (value) => {
                        originStationId = "";
                        savePrefs({ subwayLine: value || "", subwayStation: "" });
                        if (!tsStation) return;
                        tsStation.clear(true);
                        tsStation.clearOptions();
                        if (!value) {
                            tsStation.addOption({ value: "", text: "Select station…" });
                            tsStation.setValue("", true);
                            tsStation.disable();
                            return;
                        }
                        const stationOpts = [{ value: "", text: "Select station…" }];
                        for (const s of (stationsByLine[value] || [])) {
                            stationOpts.push({ value: s.id, text: s.name });
                        }
                        tsStation.addOptions(stationOpts);
                        tsStation.setValue("", true);
                        tsStation.enable();
                    },
                });

                tsStation = new TomSelect("#subway-station", {
                    dropdownParent: 'body',
                    options: [{ value: "", text: "Select station…" }],
                    items: [""],
                    create: false,
                    allowEmptyOption: true,
                    onChange: (value) => {
                        originStationId = value || "";
                        savePrefs({ subwayStation: value || "" });
                    },
                });
                tsStation.disable();

                // Restore saved subway line + station
                const prefs = loadPrefs();
                if (prefs.subwayLine && stationsByLine[prefs.subwayLine]) {
                    tsLine.setValue(prefs.subwayLine, true);
                    // Populate station options for the saved line
                    const stationOpts = [{ value: "", text: "Select station…" }];
                    for (const s of (stationsByLine[prefs.subwayLine] || [])) {
                        stationOpts.push({ value: s.id, text: s.name });
                    }
                    tsStation.clearOptions();
                    tsStation.addOptions(stationOpts);
                    tsStation.enable();
                    if (prefs.subwayStation) {
                        tsStation.setValue(prefs.subwayStation, true);
                        originStationId = prefs.subwayStation;
                    }
                }
            } catch (_) {}
        }

        distanceModeEl.addEventListener("change", () => {
            const mode = distanceModeEl.value;
            const showSubway = (mode === "transit" || mode === "walking");
            setSubwaySectionVisible(showSubway);
            savePrefs({ distanceMode: mode });
            if (!showSubway) {
                originStationId = "";
                if (tsLine) tsLine.setValue("", true);
                if (tsStation) { tsStation.clear(true); tsStation.disable(); }
            }
        });

        function getActiveFilters() {
            const maxTravelRaw = document.getElementById("max-travel").value.trim();
            const maxTravelMinutes = maxTravelRaw === "" ? null : Number(maxTravelRaw);
            const distanceMode = document.getElementById("distance-mode").value;

            return {
                distance_mode: distanceMode,
                max_travel_minutes: Number.isFinite(maxTravelMinutes) ? maxTravelMinutes : null,
                origin_station_id: originStationId || "",
            };
        }

        const SEARCHING_BUBBLE_DELAY_MS = 300;

        async function submitQuery(queryText) {
            // Event follow-up path: if the user has selected an event card, answer
            // their question about that specific event instead of running a normal query.
            if (_selectedEvent) {
                const question = queryText.trim();
                if (!question) return;

                const sel = _selectedEvent;
                _selectedEvent = null;
                chatInputEl.placeholder = "";
                document.querySelectorAll(".result-card--selected")
                    .forEach(c => c.classList.remove("result-card--selected"));

                addMessage(question, "user");
                const thinkingId = addMessage("Looking that up…", "assistant");

                fetch("/api/event-info", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        event_url: sel.url,
                        event_name: sel.name,
                        question,
                        cloudflare_protected: sel.cloudflare_protected,
                    }),
                })
                .then(r => r.json())
                .then(data => {
                    const text = data.answer || "I couldn't find more information about this event.";
                    replaceMessage(thinkingId, text);
                    const sources = data.source === "web_grounding" ? (data.sources || []) : [];
                    appendEventInfoFooter(thinkingId, sources);
                })
                .catch(() => replaceMessage(thinkingId, "Something went wrong. Try again."));
                return;  // skip normal query flow
            }

            const filters = getActiveFilters();

            // If we're answering a follow-up question, send the original query
            // with the follow-up + user's answer as context, then clear pending state.
            // Otherwise, include recent conversation history as context.
            let actualQuery = queryText;
            let context = "";
            if (_pendingQuery !== null) {
                actualQuery = _pendingQuery;
                context = `${_pendingFollowUpQuestion} ${queryText}`;
                _pendingQuery = null;
                _pendingFollowUpQuestion = null;
            }

            addMessage(queryText, "user");
            let loadingNode = null;
            let requestSettled = false;
            const loadingTimer = window.setTimeout(() => {
                if (requestSettled) {
                    return;
                }
                addMessage("Searching<span class='searching-dots'></span>", "assistant");
                loadingNode = chatLogEl.lastElementChild;
            }, SEARCHING_BUBBLE_DELAY_MS);

            sendBtnEl.disabled = true;
            chatInputEl.disabled = true;

            try {
                const recent = _chatHistory.slice(-6);
                const history = recent.length
                    ? recent.map(e => `${e.role === "user" ? "User" : "Assistant"}: ${e.text}`).join("\n")
                    : "";

                const response = await fetch("/api/query-events", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        query: actualQuery,
                        context,
                        history,
                        max_results: 60,
                        filters,
                    }),
                });

                const data = await response.json();
                requestSettled = true;
                window.clearTimeout(loadingTimer);
                if (loadingNode && loadingNode.parentNode) {
                    loadingNode.remove();
                }

                // If the assistant wants to ask a clarifying question, show it and wait.
                if (data.follow_up_question) {
                    _pendingQuery = actualQuery;
                    _pendingFollowUpQuestion = data.follow_up_question;
                    addMessage(data.follow_up_question, "assistant");
                    return;
                }

                const interpretation = data.interpretation || "Here are the best matches.";
                const prefix = `Mode: ${data.mode || "unknown"} | Candidates: ${data.filtered_count ?? "?"}/${data.input_count ?? "?"}`;
                const dateMeta = data.filters && data.filters.date ? data.filters.date : null;
                let dateSummary = "";
                if (dateMeta && dateMeta.date_window_applied) {
                    const start = String(dateMeta.date_window_start || dateMeta.date_start || "").split("T")[0] || "?";
                    const end = String(dateMeta.date_window_end || dateMeta.date_end || "").split("T")[0] || "?";
                    const post = dateMeta.post_date_count ?? dateMeta.post_filter_count ?? "?";
                    const pre = dateMeta.pre_date_count ?? dateMeta.pre_filter_count ?? "?";
                    dateSummary = `<br><small>Date tool: ${start} to ${end} (${post}/${pre} kept)</small>`;
                } else if (dateMeta && dateMeta.date_tool_called) {
                    dateSummary = `<br><small>Date tool: no date window applied</small>`;
                }
                const distanceMeta = data.distance_filter || null;
                let distanceSummary = "";
                if (distanceMeta && distanceMeta.applied) {
                    distanceSummary =
                        `<br><small>Distance tool (${distanceMeta.mode}): ${distanceMeta.kept ?? 0}/${distanceMeta.input_matches ?? 0} kept at <= ${distanceMeta.max_minutes ?? "?"} min</small>`;
                }
                const warning = data.warning ? `<br><small>${data.warning}</small>` : "";

                addMessage(`${interpretation}<br><small>${prefix}</small>${dateSummary}${distanceSummary}${warning}`, "assistant", data.matches || []);

                // Record this exchange in history for future query context
                _chatHistory.push({ role: "user", text: actualQuery });
                if (interpretation) {
                    _chatHistory.push({
                        role: "assistant",
                        text: interpretation,
                        matches: (data.matches || []).slice(0, 30).map(slimEventForStorage),
                    });
                }
                saveHistory(_chatHistory);
            } catch (error) {
                requestSettled = true;
                window.clearTimeout(loadingTimer);
                if (loadingNode && loadingNode.parentNode) {
                    loadingNode.remove();
                }
                // Clear pending state on error so the user isn't stuck
                _pendingQuery = null;
                _pendingFollowUpQuestion = null;
                addMessage(`Search failed: ${error.message}`, "assistant");
            } finally {
                sendBtnEl.disabled = false;
                chatInputEl.disabled = false;
                chatInputEl.focus();
            }
        }

        // ── Past conversations ────────────────────────────────────────────
        const SESSIONS_VERSION = 1;
        const SESSIONS_KEY = "whaddup_sessions";
        const MAX_SESSIONS = 20;

        function loadSessions() {
            try {
                const stored = JSON.parse(localStorage.getItem(SESSIONS_KEY) || "{}");
                if (stored.v === SESSIONS_VERSION && Array.isArray(stored.sessions)) {
                    return stored.sessions;
                }
            } catch (_) {}
            return [];
        }

        function persistSessions(sessions) {
            try {
                localStorage.setItem(SESSIONS_KEY, JSON.stringify({ v: SESSIONS_VERSION, sessions }));
            } catch (_) {}
        }

        let _sessions = loadSessions();
        let _activeSessionId = null;

        function saveCurrentAsSession() {
            if (!_chatHistory.length) return;
            const title = (_chatHistory.find(h => h.role === "user") || {}).text || "Untitled";
            // If we're viewing an existing session, update it in place
            if (_activeSessionId) {
                _sessions = _sessions.map(s =>
                    s.id === _activeSessionId ? { ...s, history: [..._chatHistory] } : s
                );
            } else {
                const session = {
                    id: "s-" + Date.now(),
                    title,
                    timestamp: Date.now(),
                    history: [..._chatHistory],
                };
                _sessions = [session, ..._sessions].slice(0, MAX_SESSIONS);
            }
            persistSessions(_sessions);
        }

        function relativeDate(ts) {
            const diff = Date.now() - ts;
            const mins = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);
            if (mins < 1) return "Just now";
            if (mins < 60) return `${mins}m ago`;
            if (hours < 24) return `${hours}h ago`;
            if (days === 1) return "Yesterday";
            if (days < 7) return `${days}d ago`;
            return new Date(ts).toLocaleDateString("en-US", { month: "short", day: "numeric" });
        }

        function renderSessionList() {
            const listEl = document.getElementById("session-list");
            if (!listEl) return;
            if (!_sessions.length) {
                listEl.innerHTML = '<div class="sessions-empty">No past conversations yet.</div>';
                return;
            }
            listEl.innerHTML = _sessions.map(s => {
                const title = s.title.length > 38 ? s.title.slice(0, 38) + "…" : s.title;
                const active = s.id === _activeSessionId ? " session-item--active" : "";
                return `<div class="session-item${active}" data-sid="${escapeHtml(s.id)}">
                    <div class="session-title">${escapeHtml(title)}</div>
                    <div class="session-date">${relativeDate(s.timestamp)}</div>
                </div>`;
            }).join("");
            listEl.querySelectorAll(".session-item").forEach(el => {
                el.addEventListener("click", () => restoreSession(el.dataset.sid));
            });
        }

        function restoreSession(sessionId) {
            const session = _sessions.find(s => s.id === sessionId);
            if (!session) return;

            // Save current work before switching away
            saveCurrentAsSession();

            _activeSessionId = sessionId;
            _chatHistory = [...session.history];
            saveHistory(_chatHistory);

            // Reset UI state
            _selectedEvent = null;
            _pendingQuery = null;
            _pendingFollowUpQuestion = null;
            chatInputEl.placeholder = "Ask for events...";
            chatInputEl.value = "";
            resizeChatInput();
            document.querySelectorAll(".result-card--selected")
                .forEach(c => c.classList.remove("result-card--selected"));

            // Re-render conversation — user bubbles as text, assistant bubbles with event cards
            chatLogEl.innerHTML = "";
            session.history.forEach(msg => {
                if (msg.role === "user") {
                    addMessage(escapeHtml(msg.text), "user");
                } else {
                    addMessage(renderMarkdown(msg.text), "assistant", msg.matches || []);
                }
            });

            renderSessionList();
            chatInputEl.focus();
        }

        // New chat button — save current session then start fresh
        document.getElementById("new-chat-btn").addEventListener("click", () => {
            saveCurrentAsSession();
            _activeSessionId = null;
            _chatHistory = [];
            saveHistory(_chatHistory);
            _selectedEvent = null;
            _pendingQuery = null;
            _pendingFollowUpQuestion = null;
            chatInputEl.placeholder = "Ask for events...";
            chatInputEl.value = "";
            resizeChatInput();
            document.querySelectorAll(".result-card--selected")
                .forEach(c => c.classList.remove("result-card--selected"));
            chatLogEl.innerHTML = "";
            addMessage("What do you want to do in NYC? I can find concerts, comedy shows, art openings, lectures, and more — just ask.");
            renderSessionList();
            chatInputEl.focus();
        });

        // Collapsible filters panel (mobile only) — collapsed by default on small screens
        const filtersToggleEl = document.getElementById("filters-toggle");
        const filtersPanelEl  = document.getElementById("filters-panel");
        const toggleLabelEl   = filtersToggleEl.querySelector(".filters-toggle-label");

        if (window.innerWidth <= 900) {
            filtersPanelEl.classList.add("collapsed");
            filtersToggleEl.setAttribute("aria-expanded", "false");
            toggleLabelEl.textContent = "Show";
        }

        filtersToggleEl.addEventListener("click", () => {
            const isCollapsed = filtersPanelEl.classList.toggle("collapsed");
            filtersToggleEl.setAttribute("aria-expanded", String(!isCollapsed));
            toggleLabelEl.textContent = isCollapsed ? "Show" : "Hide";
        });

        function resizeChatInput() {
            const maxHeight = parseFloat(getComputedStyle(chatInputEl).maxHeight);
            chatInputEl.style.height = "auto";
            const natural = chatInputEl.scrollHeight;
            if (natural >= maxHeight) {
                chatInputEl.style.height = maxHeight + "px";
                chatInputEl.classList.add("scrollable");
            } else {
                chatInputEl.style.height = natural + "px";
                chatInputEl.classList.remove("scrollable");
            }
        }

        chatInputEl.addEventListener("input", resizeChatInput);

        chatInputEl.addEventListener("keydown", async (event) => {
            if (event.key === "Escape" && _selectedEvent) {
                _selectedEvent = null;
                chatInputEl.placeholder = "";
                chatInputEl.value = "";
                document.querySelectorAll(".result-card--selected")
                    .forEach(c => c.classList.remove("result-card--selected"));
                return;
            }
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                const queryText = chatInputEl.value.trim();
                if (!queryText) return;
                chatInputEl.value = "";
                resizeChatInput();
                await submitQuery(queryText);
            }
        });

        chatFormEl.addEventListener("submit", async (event) => {
            event.preventDefault();
            const queryText = chatInputEl.value.trim();
            if (!queryText) return;
            chatInputEl.value = "";
            resizeChatInput();
            await submitQuery(queryText);
        });

        document.querySelectorAll(".hint").forEach((btn) => {
            btn.addEventListener("click", async () => {
                await submitQuery(btn.textContent.trim());
            });
        });

        // Restore saved travel mode + max travel, then set subway section visibility
        (function restoreFilterPrefs() {
            const prefs = loadPrefs();
            if (prefs.distanceMode) {
                distanceModeEl.value = prefs.distanceMode;
            }
            if (prefs.maxTravel !== undefined) {
                document.getElementById("max-travel").value = prefs.maxTravel;
            }
            const mode = distanceModeEl.value;
            setSubwaySectionVisible(mode === "transit" || mode === "walking");
        })();

        // Persist max-travel changes
        document.getElementById("max-travel").addEventListener("change", (e) => {
            savePrefs({ maxTravel: e.target.value });
        });

        addMessage("What do you want to do in NYC? I can find concerts, comedy shows, art openings, lectures, and more — just ask.");
        loadSubwayStations();
        renderSessionList();
    </script>
</body>
</html>
